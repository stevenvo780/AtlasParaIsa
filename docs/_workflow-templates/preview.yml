name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-and-test:
    name: Type-check + Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # Lee la versión de packageManager en package.json
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check workspace
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test
        # Si no hay tests todavía, este step no falla (pnpm -r run test en
        # paquetes sin script "test" definido es no-op por defecto).

      - name: Build @carta/web
        run: pnpm --filter @carta/web build
        # Verifica que el build de producción no rompa antes del merge.
        # El deploy real lo dispara Vercel automáticamente via integración GitHub.
