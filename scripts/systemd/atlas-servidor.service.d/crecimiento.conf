# Decisión de Steven 2026-09-23: el mundo público crece sin el freno de 50 ms del gobernador.
# 5000 ms es el máximo que admite gobernador.presupuestoMs; el techo solo se fija si el p95 del paso lo supera.
# Prioridad de CPU frente al laboratorio y la terminal (app.slice), sin root.
[Service]
CPUWeight=10000
Environment=CARTA_PARAMS=gobernador.presupuestoMs=5000
